name: CI

on:
  pull_request:
  push:
    branches: [master]

# Um PR que receba um push novo cancela a execucao anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build corre sem variaveis de ambiente de proposito: se voltar a
      # depender de uma base de dados viva, falha aqui e nao em producao.
      - name: Build
        run: npm run build

  # Os testes que atravessam a fronteira com a base de dados.
  #
  # Nao correm no ambiente de desenvolvimento deste projeto, onde nao ha
  # MongoDB disponivel: sao ignorados quando MONGODB_URI nao existe, para o
  # `npm test` continuar a correr em qualquer maquina. E aqui que correm mesmo.
  integracao:
    name: Integração com a base de dados
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # O simulador oficial da Stripe, para a sessao de pagamento: este CI,
      # como o ambiente de desenvolvimento, nao fala com a Stripe a serio.
      stripe:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111

      # Um servidor de correio que guarda o que recebe e o deixa ler: a
      # confirmacao da encomenda e obrigatoria, e isto prova que sai.
      mail:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      STRIPE_API_HOST: 127.0.0.1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM: loja@exemplo.pt
      MAILPIT_API: http://127.0.0.1:8025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes de integracao
        run: npm test

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # O servidor de testes arranca sem MONGODB_URI de proposito: a suite
      # verifica que o site aguenta a base de dados em baixo.
      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # O painel de gestao e a compra, contra uma base de dados a serio.
  #
  # A suite de cima corre sem MongoDB de proposito, e por isso nunca ve os
  # formularios do painel, que so aparecem com dados. Esta ve: cria
  # categorias e produtos pela interface, vende ao balcao, e confirma que a
  # loja mostra o que o painel gravou e que o papel vem da base de dados. E
  # compra, com a loja em ensaio, ate a pagina da Stripe (do `stripe-mock`).
  e2e-bd:
    name: Painel com base de dados
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      stripe:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111

      # Um servidor de correio que guarda o que recebe e o deixa ler: a
      # confirmacao da encomenda e obrigatoria, e isto prova que sai.
      mail:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/pds-e2e
      STRIPE_API_HOST: 127.0.0.1
      MAILPIT_API: http://127.0.0.1:8025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright, com base de dados
        run: npm run test:e2e:bd

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-bd
          path: |
            playwright-report/
            test-results/
          retention-days: 7
