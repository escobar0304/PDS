name: CI

on:
  pull_request:
  push:
    branches: [master]

# Um PR que receba um push novo cancela a execucao anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build corre sem variaveis de ambiente de proposito: se voltar a
      # depender de uma base de dados viva, falha aqui e nao em producao.
      - name: Build
        run: npm run build

  # Os testes que atravessam a fronteira com a base de dados.
  #
  # Nao correm no ambiente de desenvolvimento deste projeto, onde nao ha
  # MongoDB disponivel: sao ignorados quando MONGODB_URI nao existe, para o
  # `npm test` continuar a correr em qualquer maquina. E aqui que correm mesmo.
  integracao:
    name: Integração com a base de dados
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes de integracao
        run: npm test

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # O servidor de testes arranca sem MONGODB_URI de proposito: a suite
      # verifica que o site aguenta a base de dados em baixo.
      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
