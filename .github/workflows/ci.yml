name: CI

on:
  pull_request:
  push:
    branches: [master]

# Um PR que receba um push novo cancela a execucao anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build corre sem variaveis de ambiente de proposito: se voltar a
      # depender de uma base de dados viva, falha aqui e nao em producao.
      - name: Build
        run: npm run build
