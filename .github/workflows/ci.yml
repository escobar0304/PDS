name: CI

on:
  pull_request:
  push:
    branches: [master]

# Um PR que receba um push novo cancela a execucao anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build corre sem variaveis de ambiente de proposito: se voltar a
      # depender de uma base de dados viva, falha aqui e nao em producao.
      - name: Build
        run: npm run build

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # O servidor de testes arranca sem MONGODB_URI de proposito: a suite
      # verifica que o site aguenta a base de dados em baixo.
      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
