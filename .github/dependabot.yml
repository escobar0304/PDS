# Quem vigia as dependencias quando ninguem esta a olhar.
#
# Este ficheiro existe porque `npm audit --omit=dev` passou toda a F11 sem ser
# corrido, e quando finalmente o foi trouxe duas criticas e quatro altas em
# producao — mais do que toda a auditoria ao codigo escrito aqui encontrou.
#
# A regra deste projeto e que uma correcao sem automacao e uma fotografia que
# envelhece. O `npm audit` continua na revisao antes de cada versao, mas
# depender de memoria humana foi exactamente o que falhou. Isto nao depende.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"

    # Um PR por grupo, nao um por pacote. Com esta arvore de dependencias, sem
    # agrupar sao dezenas de PRs por mes e ninguem os le — e um Dependabot que
    # se ignora e pior do que nenhum, porque da a sensacao de estar coberto.
    groups:
      producao:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      desenvolvimento:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      seguranca:
        applies-to: security-updates
        patterns: ["*"]

    # Deixa a versao assentar antes de a propor. Uma correcao de seguranca em
    # patch nao espera tanto: a janela entre o aviso publico e a exploracao e
    # curta, e o risco de um patch mau e menor do que o de ficar exposto.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 2

    ignore:
      # As versoes maiores destes pacotes nao sao atualizacoes automaticas:
      # cada uma foi feita num PR proprio, com a suite inteira e a comparacao
      # visual de todas as paginas (01/10/2026: Next 16, React 19, mongoose 9,
      # Tailwind 4). A proxima de cada um merece o mesmo.
      #
      # O par React / React DOM nunca pode ser automatico: o Dependabot ja
      # abriu um PR que subia o `react` e deixava o `react-dom` para tras, e
      # fundi-lo partia o site.
      #
      # O Tailwind 4 mostrou porque e preciso comparar as paginas: a migracao
      # oficial deixava a pagina inicial 54 px mais alta, os titulos do rodape
      # serifados e as celulas das tabelas mais estreitas, com todos os testes
      # verdes. Ver "As dependencias" em docs/SEGURANCA.md.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongoose"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # O ESLint 10 e o TypeScript 7 partem o `npm run lint`, e a culpa nao e
      # nossa: o `eslint-config-next` traz o `eslint-plugin-react`, o
      # `jsx-a11y` e o `import`, que so aceitam o ESLint ate ao 9, e o
      # `typescript-eslint`, que so aceita o TypeScript abaixo do 6.1. Medido
      # a 29/09 e outra vez a 01/10/2026 (7.37.5, 6.10.2, 2.32.0 e 8.71.0).
      # Levantar quando `npm view eslint-plugin-react peerDependencies` e
      # `npm view typescript-eslint peerDependencies` os aceitarem.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Os tipos do Node descrevem o Node que corre o codigo, e esse e o 22
      # (o CI e a imagem Docker). Com os tipos do 26, o `tsc` aceitava APIs
      # que o 22 nao tem, e o erro so aparecia em producao. Sobem quando o
      # Node do CI subir, no mesmo PR.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

    labels:
      - "dependencias"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    open-pull-requests-limit: 5

  # As proprias accoes do CI. O aviso de que o `actions/checkout@v4` e o
  # `actions/setup-node@v4` ja estao a ser forcados para Node 24 apareceu nos
  # registos de uma execucao; e o tipo de coisa que parte o CI um dia sem nada
  # ter mudado do nosso lado.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    groups:
      accoes:
        patterns: ["*"]
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
